spring:
  application:
    name: aplus-kids-api
  config:
    import: optional:file:./application-local.yml,optional:file:./application-whatsapp.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aplus_kids}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

aplus:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-duration: ${ACCESS_TOKEN_DURATION:PT10M}
    refresh-token-duration: ${REFRESH_TOKEN_DURATION:P7D}
    remember-me-duration: ${REMEMBER_ME_DURATION:P30D}
    email-verification-duration: ${EMAIL_VERIFICATION_DURATION:PT1M}
    password-reset-duration: ${PASSWORD_RESET_DURATION:PT30M}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  mail:
    from: ${MAIL_FROM:}
  kids-champ:
    storage-path: ${KIDS_CHAMP_STORAGE_PATH:./data/kids-champ}
  whatsapp:
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v25.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    delivery-delay-ms: ${WHATSAPP_DELIVERY_DELAY_MS:2000}

logging:
  level:
    org.springframework.security: INFO
